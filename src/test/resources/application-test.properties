# =============================================================================
# Perfil "test": configuracion de las pruebas de integracion.
#
# POR QUE ESTE FICHERO Y NO src/test/resources/application.properties. Un
# application.properties en el classpath de test NO se suma al de main: lo
# sustituye, porque Spring Boot carga el primero que encuentra y target/
# test-classes va antes que target/classes. Con el, las pruebas se quedan sin
# jwt.expiration, sin app.matches.limite-diario y sin el resto de la
# configuracion, y el contexto ni arranca. Un fichero de perfil si es aditivo:
# se carga ADEMAS del principal y solo pisa las claves que declara.
#
# Se activa con @ActiveProfiles("test") en las pruebas que levantan el contexto
# completo. Las rebanadas (@WebMvcTest) no lo necesitan: no tocan la base de
# datos.
#
# POR QUE EXISTE. Los valores por defecto de application.properties apuntan a
# localhost:5432, donde en la maquina de desarrollo vive un PostgreSQL nativo
# SIN PostGIS. Las pruebas fallaban ahi con "Unable to determine Dialect without
# JDBC metadata", un error que no dice nada de la causa real, y se dieron por
# rotas durante tres bloques de trabajo. El contenedor de docker-compose publica
# en el 5433 (DB_PORT del .env) justamente para no chocar con ese servicio.
# =============================================================================

# Las credenciales se leen del .env, que esta gitignoreado, para no versionar
# ninguna contrasena aqui —el mismo motivo por el que application.properties no
# trae un jwt.secret de ejemplo—. "optional:" hace que la ausencia del fichero
# no rompa nada: sin el se usan los valores por defecto de abajo, que son los
# que docker-compose.yml asigna al crear la base de datos.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:rescate_animal}
spring.datasource.username=${DB_USER:rescate}
spring.datasource.password=${DB_PASSWORD:rescate}

# Secreto de firma solo para pruebas: no vale en ningun despliegue y por eso
# puede vivir en el repositorio. Minimo 32 caracteres (HS256). Evita tener que
# repetirlo en el @SpringBootTest de cada prueba nueva.
jwt.secret=secreto-solo-para-tests-de-al-menos-32-caracteres-1234567890

# El esquema lo pone Flyway contra la base de datos de desarrollo, igual que al
# arrancar la aplicacion: las pruebas de integracion comparten esa base y
# limpian sus propios datos al terminar. Aqui NO se sobrescribe el ddl-auto de
# application.properties (validate) a proposito: que las pruebas arrancaran con
# update taparia precisamente lo que se quiere detectar, una migracion que se
# haya olvidado de acompanar a un cambio en una entidad.

# El SQL de las pruebas no aporta nada al informe y ensucia la salida de Maven.
spring.jpa.show-sql=false

# Se FIJA validate explicitamente, y hace falta aunque application.properties ya
# ponga ${JPA_DDL_AUTO:validate}: el spring.config.import de arriba mete el .env
# en el entorno, y ese .env trae JPA_DDL_AUTO=update de cuando el esquema lo
# generaba Hibernate. El resultado era que las pruebas corrian con update sin que
# nadie lo dijera, es decir, con Hibernate autorizado a parchear el esquema por su
# cuenta: justo lo que estas pruebas deben detectar. Una entidad sin su migracion
# pasaba inadvertida porque Hibernate creaba la columna al vuelo.
spring.jpa.hibernate.ddl-auto=validate

# Los limites de intentos se suben para que no los dispare la propia suite: todas
# las pruebas de integracion salen de 127.0.0.1, asi que entre todas agotaban el
# tope de 30 por IP y la siguiente en registrarse recibia un 429. El filtro sigue
# ejecutandose en cada peticion —lo que comprueba que no estorba a los flujos
# reales—, solo que con un cupo que la suite no alcanza. Los limites de verdad los
# prueba LimiteIntentosAutenticacionFilterTest, que no depende de esta base.
app.auth.max-intentos-cuenta=100000
app.auth.max-intentos-ip=100000

# Las fotos que suben las pruebas de integracion van a target/, que limpia
# "mvn clean", y no al ./uploads de desarrollo, que se quedaria lleno de ellas.
app.fotos.directorio=target/fotos-test
app.fotos.url-publica=https://fotos.test/fotos
# La limpieza diaria no se ejecuta sola durante las pruebas: la que la prueba
# (LimpiezaFotosTest) la llama a mano, y en cualquier otra borraria fotos ajenas.
app.fotos.limpieza-cron=-
