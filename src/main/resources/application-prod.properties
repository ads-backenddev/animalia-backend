# ---------------------------------------------------------------------------
# Perfil de produccion. Se activa con SPRING_PROFILES_ACTIVE=prod.
#
# Diferencia clave con el perfil por defecto: aqui los secretos NO tienen valor
# por defecto. Si falta una variable de entorno la aplicacion no arranca, en
# lugar de quedarse con una credencial de desarrollo (RNF-10, RGPD).
# ---------------------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema no se modifica solo: se valida contra la base de datos y el
# arranque falla si no coincide con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.reset-expiration=${JWT_RESET_EXPIRATION:3600000}

# HTTPS en todas las peticiones (RNF-04): respeta las cabeceras X-Forwarded-*
# del proxy inverso o balanceador que termina el TLS, para que las URLs
# generadas (enlace de recuperacion de contrasena) usen https.
server.forward-headers-strategy=framework

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Superficie de monitorizacion minima.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Sin trazas de datos personales en los logs (RNF-10, RGPD).
logging.level.root=WARN
logging.level.com.rescateanimal.backend=INFO
logging.level.org.hibernate.SQL=WARN
