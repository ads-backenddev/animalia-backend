# ---------------------------------------------------------------------------
# Perfil de produccion. Se activa con SPRING_PROFILES_ACTIVE=prod.
#
# Diferencia clave con el perfil por defecto: aqui los secretos NO tienen valor
# por defecto. Si falta una variable de entorno la aplicacion no arranca, en
# lugar de quedarse con una credencial de desarrollo (RNF-10, RGPD).
# ---------------------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema no se modifica solo: se valida contra la base de datos y el
# arranque falla si no coincide con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.reset-expiration=${JWT_RESET_EXPIRATION:3600000}

# Cabeceras X-Forwarded-* del proxy de Railway, que termina el TLS (RNF-04),
# con la estrategia NATIVE de Tomcat (RemoteIpValve) y no la de Spring
# ("framework"). La diferencia es la IP del cliente, que usa el limite de
# intentos por IP (informe ENS, C1): "framework" la tomaba del PRIMER valor de
# X-Forwarded-For, que escribe el propio cliente, y una cabecera inventada en
# cada intento esquivaba el limite. RemoteIpValve recorre la cabecera de
# derecha a izquierda, salta solo los proxies de confianza y se queda con la
# primera direccion que no lo es: la que anadio el proxy. Lo que el cliente
# escriba a la izquierda no cuenta.
#
# PROXIES DE CONFIANZA: los de Spring Boot por defecto, los rangos privados
# (10/8, 172.16/12, 192.168/16, 100.64/10, 127/8, fc00::/7...). El proxy de
# Railway tiene que conectar desde uno de ellos; si no, Tomcat no leeria la
# cabecera y todos los clientes compartirian la IP del proxy. Hay que
# comprobarlo en Railway (anexo del informe ENS, punto 1) y, si hiciera falta,
# fijar la lista con SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES.
server.forward-headers-strategy=native

# Correo por la API de Resend (ResendEmailSender), no por SMTP. Las dos
# variables llegan vacias si faltan, a proposito: ResendEmailSender las
# comprueba al arrancar y, si falta alguna, la aplicacion no arranca con un
# mensaje que nombra la variable y nunca su valor. RESEND_API_KEY es una clave
# con permiso solo de envio; MAIL_FROM, un remitente de un dominio verificado
# en Resend ("Nombre <direccion>" o la direccion sola).
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.remitente=${MAIL_FROM:}

# Sin default, igual que los secretos: si faltara, el correo de recuperacion
# (RF-17) saldria con enlaces a localhost por HTTP plano y en silencio, lo que
# ademas incumpliria RNF-04. Debe ser una URL https del dominio real.
app.mail.url-restablecer=${APP_URL_RESTABLECER}

# Origenes autorizados del cliente y del panel web. Nunca "*" en produccion.
app.cors.origenes=${APP_CORS_ORIGENES}

# Fotos subidas. Sin valores por defecto, por el mismo motivo que el correo: un
# ./uploads dentro del contenedor se borraria en cada despliegue sin avisar.
# FOTOS_DIR es el punto de montaje del volumen de Railway (p. ej. /data/fotos) y
# APP_FOTOS_URL_PUBLICA la base https del dominio real (https://<dominio>/fotos).
app.fotos.directorio=${FOTOS_DIR}
app.fotos.url-publica=${APP_FOTOS_URL_PUBLICA}
app.fotos.exigir-https=true

# Superficie de monitorizacion minima.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Sin trazas de datos personales en los logs (RNF-10, RGPD).
logging.level.root=WARN
logging.level.com.rescateanimal.backend=INFO
logging.level.org.hibernate.SQL=WARN
