spring.application.name=backend

# ---------------------------------------------------------------------------
# Base de datos: PostgreSQL con la extension PostGIS.
# Todos los valores llegan por variable de entorno; los defaults son para
# desarrollo local (docker-compose.yml los sobrescribe apuntando al host "db").
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rescate_animal}
spring.datasource.username=${DB_USER:rescate}
spring.datasource.password=${DB_PASSWORD:rescate}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# El soporte espacial (tipos Point de PostGIS) lo activa Hibernate al detectar
# hibernate-spatial en el classpath, sin necesidad de declarar un dialecto.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Indices GiST de PostGIS: @Index de JPA solo genera B-tree, que no sirve para
# las columnas geometry. El script se ejecuta DESPUES de que Hibernate cree el
# esquema, de ahi el defer.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/indices-postgis.sql

# ---------------------------------------------------------------------------
# JWT (RF-13).
#
# SIN valor por defecto a proposito: un secreto de ejemplo aqui estaria publicado
# en el repositorio, y cualquiera que lo leyera podria firmar un token de ADMIN
# valido en cualquier despliegue que olvidara sobrescribirlo. Es preferible que
# la aplicacion no arranque a que arranque insegura.
#
# Para desarrollo, definelo en application-local.properties (gitignoreado) o
# como variable de entorno JWT_SECRET. Minimo 32 caracteres (HS256).
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
# Validez del token de acceso en milisegundos (24 h).
jwt.expiration=${JWT_EXPIRATION:86400000}
# Validez del enlace de recuperacion de contrasena en milisegundos (1 h, RF-17).
jwt.reset-expiration=${JWT_RESET_EXPIRATION:3600000}

# ---------------------------------------------------------------------------
# Subida de fotos de alertas y avistamientos (RF-03, RF-21)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# Correo saliente para el enlace de recuperacion de contrasena (RF-17)
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# Remitente y destino del enlace del correo de recuperacion (RF-17).
app.mail.remitente=${MAIL_REMITENTE:no-reply@rescateanimal.es}
app.mail.url-restablecer=${APP_URL_RESTABLECER:http://localhost:8081/restablecer-password}

# ---------------------------------------------------------------------------
# Actuator: /actuator/health lo usa el healthcheck de Docker Compose (RNF-06)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# El indicador de salud del correo abre una conexion SMTP en cada sondeo y marca
# toda la aplicacion como DOWN si el servidor no responde. El correo es una
# dependencia opcional (solo RF-17): que este caido no impide atender peticiones,
# y con esto activado el healthcheck del contenedor reiniciaria la API sin motivo.
management.health.mail.enabled=false

# ---------------------------------------------------------------------------
# Reglas de negocio configurables
# ---------------------------------------------------------------------------
# Limite de matches diarios por usuario (RF-24).
app.matches.limite-diario=${MATCHES_LIMITE_DIARIO:20}

# Tamano de la tanda que devuelve GET /api/avistamientos/feed (RF-15). El feed se
# consume tarjeta a tarjeta, asi que no tiene sentido mandar el catalogo entero.
app.avistamientos.tamanyo-feed=${AVISTAMIENTOS_TAMANYO_FEED:30}
# Radio en metros para considerar dos alertas duplicadas (RF-25).
app.alertas.radio-duplicados-metros=${ALERTAS_RADIO_DUPLICADOS:500}
# Ventana temporal en horas para la deteccion de duplicados (RF-25).
app.alertas.ventana-duplicados-horas=${ALERTAS_VENTANA_DUPLICADOS:24}

# Radio maximo que admite el filtro de area de GET /api/alertas/mapa. 50 km cubre
# de sobra cualquier vista razonable de mapa; el tope existe para que nadie pida
# las alertas de todo el pais en una sola llamada (RNF-02).
app.alertas.radio-mapa-maximo-metros=${ALERTAS_RADIO_MAPA_MAXIMO:50000}

server.port=${SERVER_PORT:8080}
