# Base de datos de desarrollo local: PostgreSQL con PostGIS.
#
# La aplicacion NO se levanta aqui a proposito: durante el desarrollo se ejecuta
# directamente desde IntelliJ con el perfil "local" (ver
# src/main/resources/application-local.properties), que apunta a esta base de
# datos en localhost:5432. El Dockerfile del repositorio se conserva para el
# despliegue en Railway, no para el entorno local.
#
# Arranque:  docker compose up -d
# Logs:      docker compose logs -f db
# Parada:    docker compose down          (down -v borra tambien los datos)

services:

  db:
    # Imagen oficial de PostGIS: trae la extension ya instalada y habilitada en
    # la base de datos por defecto, necesaria para los campos Point.
    image: postgis/postgis:16-3.4
    container_name: rescate-animal-db
    environment:
      # Estas variables SOLO se aplican al inicializar el volumen por primera
      # vez. Si cambias usuario o contrasena despues, hace falta un
      # "docker compose down -v" para que tengan efecto (borra los datos).
      POSTGRES_DB: ${DB_NAME:-rescate_animal}
      POSTGRES_USER: ${DB_USER:-rescate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rescate}
    ports:
      # Si el 5432 ya estuviera ocupado, cambia DB_PORT en el .env y ajusta
      # tambien spring.datasource.url en application-local.properties.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Comprueba que la base de datos acepta conexiones, no solo que el
      # contenedor este arrancado.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rescate} -d ${DB_NAME:-rescate_animal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
